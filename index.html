<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- Wichtig fürs Handy: Seite passt sich der Bildschirmbreite an -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1420">
  <title>Fit &amp; Fuel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Hier zeichnet die App den jeweils aktiven Screen hinein -->
  <main id="screen"></main>

  <!-- Untere Navigation -->
  <nav id="nav">
    <button data-tab="heute"><span>🏠</span>Heute</button>
    <button data-tab="tracken"><span>➕</span>Eintragen</button>
    <button data-tab="training"><span>💪</span>Training</button>
    <button data-tab="essen"><span>🍌</span>Essen</button>
    <button data-tab="fortschritt"><span>📈</span>Fortschritt</button>
  </nav>

  <!-- Aufklapp-Fenster für Details und Auswahl -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-box">
      <button class="sheet-close" data-action="sheet-zu" aria-label="Schließen">✕</button>
      <div id="sheet-inhalt"></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <!-- Reihenfolge ist wichtig: erst Daten, dann Logik, zuletzt der Start -->
  <script src="js/data/uebungen.js"></script>
  <script src="js/data/drills.js"></script>
  <script src="js/data/essen.js"></script>
  <script src="js/data/quellen.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/erholung.js"></script>
  <script src="js/hilfen.js"></script>
  <script src="js/planer.js"></script>
  <script src="js/screens/heute.js"></script>
  <script src="js/screens/tracken.js"></script>
  <script src="js/screens/training.js"></script>
  <script src="js/screens/essen.js"></script>
  <script src="js/screens/fortschritt.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
